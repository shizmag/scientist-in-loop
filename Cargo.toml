[workspace]
resolver = "2"
members = [
    "crates/sil",
    "crates/sil-core",
    "crates/sil-db",
    "crates/sil-git",
    "crates/sil-parse",
    "crates/sil-latex",
    "crates/sil-agent",
    "crates/sil-template",
    "crates/sil-tui",
    "crates/sil-mcp",
    "crates/sil-regex",
]
default-members = ["crates/sil"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/scientist-in-loop/scientist-in-loop"

[workspace.dependencies]
sil-core = { path = "crates/sil-core" }
sil-db = { path = "crates/sil-db" }
sil-git = { path = "crates/sil-git" }
sil-parse = { path = "crates/sil-parse" }
sil-latex = { path = "crates/sil-latex" }
sil-agent = { path = "crates/sil-agent" }
sil-template = { path = "crates/sil-template" }
sil-tui = { path = "crates/sil-tui" }
sil-mcp = { path = "crates/sil-mcp" }
sil-regex = { path = "crates/sil-regex" }

regex = "1.11"
ratatui = "0.30"
crossterm = "0.29"
ureq = { version = "2.12", features = ["json"] }

anyhow = "1"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive"] }
console = "0.16"
indicatif = "0.18"
owo-colors = "4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tempfile = "3"
dirs = "6"
zip = "8.6"
assert_cmd = "2"
predicates = "3"
termimad = "0.35"
xberg = { version = "1.0.14", features = ["pdf", "ocr", "layout-types", "layout-detection", "ner-onnx"] }
# Pin to match xberg/xberg-gliner transitive ort (dual-runtime spike / KD-20).
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "api-18", "ndarray", "download-binaries", "tls-rustls"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
schemars = "0.8"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
dialoguer = "0.11"
proptest = "1.6"

[patch.crates-io]
# Temporary patch for zune-jpeg to fix a compilation error in Rust 2024 edition
# (missing semicolon in macro expansion in zune-jpeg 0.5.15).
# Pinned to a specific commit that works with the current version of the `image` crate.
# This can be safely removed once `zune-jpeg` 0.5.16 is released and `image` updates its dependencies.
zune-jpeg = { git = "https://github.com/etemesi254/zune-image.git", rev = "0346b875" }
zune-core = { git = "https://github.com/etemesi254/zune-image.git", rev = "0346b875" }
