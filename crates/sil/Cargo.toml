[package]
name = "sil"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "scientist-in-loop CLI — agent-friendly scientific paper workspace"
publish = false

[[bin]]
name = "sil"
path = "src/main.rs"

[features]
default = []
## Enable real ONNX dense RAG in sil-db (inherits via feature unification for path deps).
onnx = ["sil-db/onnx"]

[dependencies]
anyhow = { workspace = true }
camino = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
dialoguer = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sil-agent = { workspace = true }
sil-core = { workspace = true }
sil-db = { workspace = true }
sil-git = { workspace = true }
sil-latex = { workspace = true }
sil-parse = { workspace = true }
sil-regex = { workspace = true }
sil-template = { workspace = true }
sil-tui = { workspace = true }
sil-mcp = { workspace = true }
termimad = { workspace = true }
crossterm = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
serde_json = { workspace = true }
sil-parse = { workspace = true }
zip = { workspace = true }
tokio = { workspace = true, features = ["full"] }
